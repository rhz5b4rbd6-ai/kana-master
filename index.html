<section id="learn">
<div class="card">

</div>
<div class="card"><div class="section">기본음</div><div class="grid" id="basicGrid"></div></div>
<div class="card"><div class="section">탁음 · 반탁음 · 요음</div><div class="grid" id="specialGrid"></div></div>
</section>

<section id="quiz" class="hidden"><div class="card">

<div class="row" style="margin-top:12px"><button class="secondary" onclick="listen()">🔊 듣기</button><button class="secondary" onclick="newQuiz()">↻ 다시</button></div>
</div></section>

<section id="review" class="hidden">

<div class="card"><button class="primary" onclick="weakQuiz()">취약 글자 집중 복습</button></div>
</section>
</div>

function jump(i){idx=i;render()}function next(){if(idx<arr().length-1)idx++;else mode=mode==="h"?"k":"h",idx=0;render()}function prev(){if(idx>0)idx--;render()}
function learned(){prog[mode+"_"+arr()[idx][0]]=1;save();next()}
function specialLearn(i){let x=SPECIAL[i];$("title").textContent="특수음";$("kana").textContent=x[0];$("roma").textContent=x[1]+" · "+x[2];$("words").innerHTML=x.slice(3).map(w=>{let p=w.split("|");return `<div class="word"><button class="sound" onclick="speak('${p[0]}')">🔊</button><div class="jp">${p[0]}</div><div class="ko">${p[2]} · ${p[1]}</div></div>`}).join("");window.scrollTo({top:0,behavior:"smooth"})}
function poolData(){return arr().concat(SPECIAL)}
function newQuiz(source=arr()){quiz=[];source.forEach(x=>{quiz.push({type:"kana",p:x[2],a:x[0],ref:x});quiz.push({type:"word",p:x[3].split("|")[0],a:x[3].split("|")[2],ref:x,s:x[3].split("|")[0]})});quiz.sort(()=>Math.random()-.5);quiz=quiz.slice(0,20);qi=0;score=0;show("quiz");renderQuiz()}
function renderQuiz(){
if(qi>=quiz.length){finish();return}current=quiz[qi];answered=false;$("qcount").textContent=`문제 ${qi+1} / ${quiz.length}`;$("qbar").style.width=(qi/quiz.length*100)+"%";
$("question").innerHTML=current.type==="kana"?`<span class="muted">이 발음의 글자는?</span><br><b>${current.p}</b>`:`<span class="muted">이 단어의 뜻은?</span><br><b>${current.p}</b>`;
let source=current.type==="kana"?poolData().map(x=>x[0]):poolData().map(x=>x[3].split("|")[2]),o=[current.a];while(o.length<4){let v=source[Math.floor(Math.random()*source.length)];if(v&&!o.includes(v))o.push(v)}o.sort(()=>Math.random()-.5);$("choices").innerHTML=o.map(v=>`<button class="choice" onclick="answer(this,${JSON.stringify(v)})">${v}</button>`).join("");$("feedback").textContent="";if(current.s)speak(current.s)}
function answer(btn,v){if(answered)return;answered=true;let id=(SPECIAL.includes(current.ref)?"s_":mode+"_")+current.ref[0],old=stats[id]??50;stats[id]=v===current.a?Math.min(100,old+10):Math.max(0,old-20);today++;save();document.querySelectorAll(".choice").forEach(b=>{if(b.textContent===current.a)b.classList.add("correct")});if(v===current.a){score++;btn.classList.add("correct");$("feedback").textContent="🎉 정답!"}else{btn.classList.add("wrong");$("feedback").innerHTML=`정답은 <b>${current.a}</b>`}setTimeout(()=>{qi++;renderQuiz()},600)}
function listen(){if(current){if(current.s)speak(current.s);else speak(current.ref[0])}}
function finish(){$("qbar").style.width="100%";$("question").innerHTML=`<div class="big">${score} / ${quiz.length}</div><div>학습 완료!</div>`;$("choices").innerHTML=`<button class="primary" onclick="newQuiz()">다시 풀기</button>`;$("feedback").innerHTML="틀린 문제는 복습 메뉴의 취약 글자에 반영됩니다."}
function weakQuiz(){let all=poolData(),w=all.filter(x=>(stats[(SPECIAL.includes(x)?"s_":mode+"_")+x[0]]??50)<70);if(!w.length){alert("현재 취약 글자가 없어요!");return}newQuiz(w)}
function review(){
let all=H.concat(K),w=all.map((x,i)=>({x,mode:i<46?"h":"k",s:stats[(i<46?"h_":"k_")+x[0]]??50})).filter(z=>z.s<70).sort((a,b)=>a.s-b.s).slice(0,10);
$("due").innerHTML=`오늘 <b>${today}문제</b>를 풀었어요. 정답률이 낮은 글자는 반복 출제됩니다. <br>목표는 하루 5~10분이에요.`;
$("weak").innerHTML=w.length?w.map(z=>`<div class="stat"><span>${z.x[0]} · ${z.x[2]}</span><b>${z.s}%</b></div>`).join(""):"<div class='center'>취약 글자가 없어요 🎉</div>";
$("hs").textContent=H.filter(x=>prog["h_"+x[0]]).length+" / 46";$("ks").textContent=K.filter(x=>prog["k_"+x[0]]).length+" / 46";$("ts").textContent=today+"문제";
}
$("today").textContent="오늘 "+today+"문제";render();
</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
